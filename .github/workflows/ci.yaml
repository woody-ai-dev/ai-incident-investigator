name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LLM_ENABLED: "false"

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: investigator
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: investigator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investigator -d investigator_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://investigator:test-only@127.0.0.1:5432/investigator_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.23"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Test migrations and persistence on PostgreSQL
        run: uv run --locked pytest -m postgres

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.23"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev --extra ingestion

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked mypy

      - name: Run tests with Python coverage
        run: uv run --locked pytest --cov --cov-report=term --cov-report=xml:data/coverage.xml

      - name: Generate Python coverage badge
        run: >-
          uv run --locked python scripts/coverage_badge.py
          --input data/coverage.xml
          --output data/coverage-badge/python-coverage.svg

      - name: Upload Python coverage report and badge
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: |
            data/coverage.xml
            data/coverage-badge/python-coverage.svg
          if-no-files-found: error
          retention-days: 7

      - name: Evaluate offline investigation scenarios
        run: uv run --locked python scripts/evaluate_investigations.py

      - name: Evaluate offline metric-boundary scenarios
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked python scripts/evaluate_investigations.py
          --dataset evals/metric-boundaries.json
          --output data/metric-boundary-results.json

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-evaluation-results
          path: |
            data/evaluation-results.json
            data/metric-boundary-results.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Check browser test types
        run: npm run check:e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test production UI in Chromium
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-ui-results
          path: |
            frontend/playwright-report/ui/
            frontend/test-results/ui/
          if-no-files-found: ignore
          retention-days: 7

  java-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: demo-services/order-service/pom.xml

      - name: Build and test Java service
        working-directory: demo-services/order-service
        run: ./mvnw -B -ntp clean verify

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.23"

      - name: Install Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Validate Java logs with Python
        run: >-
          uv run --locked python scripts/check_demo_logs.py
          demo-services/order-service/target/test-logs/timeout.jsonl

  coverage-badge:
    name: Publish Python coverage badge
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: python-coverage-badge
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download tested coverage artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-coverage
          path: coverage-artifact

      - name: Publish badge to the coverage-badges branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "::notice::A newer main commit exists; its run will publish coverage."
            exit 0
          fi

          badge_dir="$RUNNER_TEMP/coverage-badges"
          if git show-ref --verify --quiet refs/remotes/origin/coverage-badges; then
            git worktree add --detach "$badge_dir" origin/coverage-badges
          else
            git worktree add --detach "$badge_dir" "$SOURCE_SHA"
            git -C "$badge_dir" switch --orphan coverage-badges
          fi

          cp coverage-artifact/coverage-badge/python-coverage.svg "$badge_dir/"
          git -C "$badge_dir" add python-coverage.svg
          if git -C "$badge_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$badge_dir" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs: update Python coverage badge"
          git -C "$badge_dir" push origin HEAD:refs/heads/coverage-badges

  docker-demo:
    needs: [checks, storage, java-demo, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.23"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.persistence.yaml config --quiet

      - name: Build and start demo
        run: docker compose up --build --wait --wait-timeout 180

      - name: Validate Prometheus configuration
        run: >-
          docker compose exec -T prometheus
          /bin/promtool check config /etc/prometheus/prometheus.yml

      - name: Check incident investigation
        run: uv run --locked python scripts/check_compose_demo.py

      - name: Check Prometheus metrics
        run: uv run --locked python scripts/check_prometheus_demo.py

      - name: Check investigation metric evidence
        run: uv run --locked python scripts/check_investigation_metrics.py

      - name: Check investigation Actuator context
        run: uv run --locked python scripts/check_investigation_context.py

      - name: Check the frontend API proxy
        run: >-
          uv run --locked python scripts/check_compose_demo.py
          --investigator-url http://127.0.0.1:3000/api

      - name: Test the Compose UI in Chromium
        working-directory: frontend
        run: npm run test:e2e:compose

      - name: Start the persistence demo
        run: >-
          docker compose -f compose.yaml -f compose.persistence.yaml
          up --build --wait --wait-timeout 180

      - name: Check saved investigation retrieval
        run: uv run --locked python scripts/check_investigation_storage.py

      - name: Check saved investigation retrieval through the frontend proxy
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors --max-time 3 http://127.0.0.1:3000/api/health
          uv run --locked python scripts/check_investigation_storage.py --investigator-url http://127.0.0.1:3000/api

      - name: Test saved investigation history in Chromium
        working-directory: frontend
        run: npm run test:e2e:history

      - name: Upload Compose browser test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-compose-results
          path: |
            frontend/playwright-report/compose/
            frontend/test-results/compose/
            frontend/playwright-report/history/
            frontend/test-results/history/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs
        if: always()
        run: docker compose -f compose.yaml -f compose.persistence.yaml logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.persistence.yaml
          down --volumes --remove-orphans
