name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LLM_ENABLED: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.23"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked mypy

      - name: Run tests
        run: uv run --locked pytest

  java-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: demo-services/order-service/pom.xml

      - name: Build and test Java service
        working-directory: demo-services/order-service
        run: ./mvnw -B -ntp clean verify

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.23"

      - name: Install Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Validate Java logs with Python
        run: >-
          uv run --locked python scripts/check_demo_logs.py
          demo-services/order-service/target/test-logs/timeout.jsonl

  docker-demo:
    needs: [checks, java-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.23"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start demo
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check incident investigation
        run: uv run --locked python scripts/check_compose_demo.py

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans