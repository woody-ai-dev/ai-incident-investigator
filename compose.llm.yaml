# Explicit opt-in: this override enables real, billable analysis on the backend.
# Compose reads interpolation values from the private .env file or shell.
# Validate with `config --quiet`; full rendered config contains the API key.
services:
  investigator:
    environment:
      LLM_ENABLED: "true"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in a private .env file}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}"
