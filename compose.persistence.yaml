services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investigator
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: investigator
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - investigation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigator -d investigator"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+psycopg://investigator:local-demo-only@postgres:5432/investigator"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  investigator:
    environment:
      DATABASE_URL: "postgresql+psycopg://investigator:local-demo-only@postgres:5432/investigator"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  investigation-data:
