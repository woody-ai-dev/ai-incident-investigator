name: ai-incident-investigator

services:
  order-service:
    build:
      context: ./demo-services/order-service
    init: true
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8081"
      DEMO_ENVIRONMENT: "local"
      DEMO_PAYMENT_MODE: "payment-timeout"
      DEMO_LOG_FILE: "/data/order-service.jsonl"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - type: volume
        source: demo-logs
        target: /data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  investigator:
    build:
      context: .
    init: true
    environment:
      INVESTIGATOR_LOG_PATH: "/data/order-service.jsonl"
      LLM_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: volume
        source: demo-logs
        target: /data
        read_only: true
    depends_on:
      order-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.15.0
    init: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ./observability/prometheus/prometheus.yaml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: prometheus-data
        target: /prometheus
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  demo-logs:
  prometheus-data: