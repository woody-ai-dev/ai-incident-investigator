worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 64k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $document_cache_control {
        default "no-store";
        ~^/assets/ "";
    }

    # Refresh the backend address when Docker recreates its container.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    upstream investigator_backend {
        zone investigator_backend 64k;
        server investigator:8000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control $document_cache_control always;

        # One random nonce per response, shared with the trusted UI style emitters.
        sub_filter '__CSP_STYLE_NONCE__' '$request_id';
        sub_filter_once on;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://investigator_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location / {
            etag off;
            try_files $uri $uri/ /index.html;
        }
    }
}
