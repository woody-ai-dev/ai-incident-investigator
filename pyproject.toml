[project]
name = "ai-incident-investigator"
version = "0.2.0"
description = "An AI assistant for investigating service incidents"
readme = "README.md"
authors = [
    { name = "Alex Vasyaev", email = "alexwoodyside@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.24.0,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7,<8",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = ["postgres: requires a dedicated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "migrations"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ai_incident_investigator"]
